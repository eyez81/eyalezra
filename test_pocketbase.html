<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>בדיקת PocketBase Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f6f6;
      color: #222;
      direction: rtl;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .status {
      margin: 20px 0;
      padding: 14px 16px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    .album-card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      margin-bottom: 30px;
    }

    .album-header {
      padding: 20px;
      border-bottom: 1px solid #eee;
    }

    .album-header h2 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .album-header p {
      margin: 0;
      color: #666;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      padding: 20px;
    }

    .photo {
      background: #eee;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-title {
      padding: 8px 10px 12px;
      font-size: 14px;
      color: #555;
      background: #fff;
    }

    .error {
      color: #b00020;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>בדיקת חיבור ל־PocketBase</h1>
    <div id="status" class="status">טוען נתונים מ־PocketBase...</div>
    <section id="content"></section>
  </main>

  <script>
    const PB_BASE_URL = "https://photo-api.eyalnas.cc";

    async function fetchJson(url) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`HTTP ${response.status} - ${response.statusText}`);
      }
      return response.json();
    }

    async function loadPortfolio() {
      const statusEl = document.getElementById("status");
      const contentEl = document.getElementById("content");

      try {
        const albumsUrl = `${PB_BASE_URL}/api/collections/portfolio_albums/records?sort=sort_order`;
        const photosUrl = `${PB_BASE_URL}/api/collections/portfolio_photos/records?sort=sort_order&expand=album`;

        const [albumsData, photosData] = await Promise.all([
          fetchJson(albumsUrl),
          fetchJson(photosUrl)
        ]);

        const albums = albumsData.items || [];
        const photos = photosData.items || [];

        statusEl.textContent = `החיבור עובד. נמצאו ${albums.length} אלבומים ו־${photos.length} תמונות.`;

        if (albums.length === 0) {
          contentEl.innerHTML = "<p>לא נמצאו אלבומים להצגה.</p>";
          return;
        }

        contentEl.innerHTML = albums.map(album => {
          const albumPhotos = photos.filter(photo => photo.album === album.id);

          return `
            <article class="album-card">
              <div class="album-header">
                <h2>${escapeHtml(album.title)}</h2>
                <p>קטגוריה: ${escapeHtml(album.category || "")}</p>
              </div>
              <div class="grid">
                ${albumPhotos.map(photo => `
                  <div>
                    <div class="photo">
                      <img src="${photo.image_url}" alt="${escapeHtml(photo.title || album.title)}" loading="lazy" />
                    </div>
                    <div class="photo-title">${escapeHtml(photo.title || "")}</div>
                  </div>
                `).join("")}
              </div>
            </article>
          `;
        }).join("");
      } catch (error) {
        console.error(error);
        statusEl.innerHTML = `<span class="error">שגיאה בטעינת הנתונים: ${escapeHtml(error.message)}</span>`;
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    loadPortfolio();
  </script>
</body>
</html>
